theme = "onedark"

[editor]
line-number = "relative"
mouse = false
auto-save = true
completion-trigger-len = 1
color-modes = true
bufferline = "always"
scrolloff = 8

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "file-name"]
center = []
right = ["position", "file-type"]
separator = "│"

[editor.indent-guides]
render = true
character = "│"

[editor.whitespace.render]
space = "none"
tab = "none"

[keys.normal]
"C-s" = ":w"
"C-q" = ":q"
"C-/" = "toggle_comments"
esc = ["collapse_selection", "keep_primary_selection"]
